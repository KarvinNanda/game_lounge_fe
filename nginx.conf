server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Hardening dasar ───────────────────────────────────────
    # Sembunyikan versi nginx dari response header & error page
    server_tokens off;

    # Tolak akses ke dotfiles (.git, .env, dsb) jika ikut ter-copy
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    gzip_min_length 1000;

    # ── SPA Routing ───────────────────────────────────────────
    # Semua path yang tidak match file statis diarahkan ke index.html
    # supaya Vue Router bisa handle client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static Asset Caching ──────────────────────────────────
    # File-file hasil build Vite sudah punya hash di nama file,
    # aman di-cache sangat lama (immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header di location meng-override header level server —
        # nosniff wajib diulang di sini agar JS/CSS tetap terlindungi
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Matikan API browser yang tidak dipakai aplikasi ini
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # HSTS — hanya efektif via HTTPS; aman dideklarasikan di sini
    # (reverse proxy / Coolify yang terminasi TLS akan meneruskannya)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy:
    # - 'unsafe-inline' untuk style diperlukan oleh Element Plus (inline styles)
    # - connect-src https: agar API call ke backend domain apa pun via TLS tetap jalan
    #   (kencangkan ke domain spesifik saat URL API production sudah final)
    # - object/frame dikunci penuh
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:8080; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}
