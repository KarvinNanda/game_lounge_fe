name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js setup (sesuai engines di package.json: >=22.12.0) ───────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install dependencies (clean install, tidak pakai node_modules cache) ─
      - name: Install dependencies
        run: npm ci

      # ── 4. Lint ────────────────────────────────────────────────────────────
      # oxlint + eslint dijalankan via npm run lint (npm-run-all2 run-s lint:*)
      # --fix di script asli: auto-fix yang bisa, non-fixable → exit non-zero → CI fail
      - name: Lint
        run: npm run lint

      # ── 5. Unit tests ──────────────────────────────────────────────────────
      - name: Unit tests
        run: npm test

      # ── 6. Coverage (opsional — upload sebagai artifact) ──────────────────
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # ── 7. Build production ────────────────────────────────────────────────
      - name: Build
        run: npm run build
