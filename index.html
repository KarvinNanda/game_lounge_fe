<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/src/assets/logo.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Gaming</title>
    <!-- ─── Prevent white flash in dark mode ───────────────────────
         Set bg BEFORE any JS/CSS loads. Script runs synchronously
         so it applies before first paint.
    ──────────────────────────────────────────────────────────────── -->
    <style>
      html, body { background-color: #010214; }
    </style>
    <script>
      (function () {
        var theme = localStorage.getItem('theme')
        if (theme === 'light') {
          document.documentElement.style.backgroundColor = '#f0f6ff'
          document.body && (document.body.style.backgroundColor = '#f0f6ff')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
